<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#0f1318;min-height:100vh;display:flex;align-items:center;justify-content:center;color:#e8eaf0;text-align:center;padding:20px}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);background-size:40px 40px;pointer-events:none}
.card{background:#181e27;border:1.5px solid #252d3a;border-radius:20px;padding:50px 40px;max-width:440px;position:relative;z-index:1}
.icon{font-size:72px;margin-bottom:16px;animation:shake 2s ease-in-out infinite}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
.code{font-family:'Rajdhani',sans-serif;font-size:80px;font-weight:700;color:#e03030;line-height:1;margin-bottom:8px}
.title{font-family:'Rajdhani',sans-serif;font-size:22px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.desc{font-size:13px;color:#6b7892;line-height:1.7;margin-bottom:28px}
.btn{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,#7b1416,#e03030);color:#fff;text-decoration:none;padding:12px 28px;border-radius:10px;font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:700;letter-spacing:.8px;transition:all .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(224,48,48,.4)}
.company{margin-top:24px;font-size:11px;color:#3a4560}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🔥</div>
  <div class="code">404</div>
  <div class="title">Page Not Found</div>
  <div class="desc">আপনি যে page টি খুঁজছেন সেটি পাওয়া যায়নি।<br>হয়তো link টি ভুল, অথবা page টি সরিয়ে ফেলা হয়েছে।</div>
  <a href="dashboard.html" class="btn">🏠 Dashboard-এ ফিরুন</a>
  <div class="company">Fire & Safety System — Seven Circle (Bangladesh) Ltd.</div>
</div>
</body>
</html>
