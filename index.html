<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fire & Safety Work Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey:            "AIzaSyDS1f3vKcohxGEvYdEBjVdBsm0E9ppmmBQ",
    authDomain:        "fire-safety-tracker-a1826.firebaseapp.com",
    databaseURL:       "https://fire-safety-tracker-a1826-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId:         "fire-safety-tracker-a1826",
    storageBucket:     "fire-safety-tracker-a1826.firebasestorage.app",
    messagingSenderId: "561656890483",
    appId:             "1:561656890483:web:82b1cf24a0db230992d686"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);
  const TASKS_REF = ref(db, 'tasks');

  const ADMIN_PASSWORD = "safety@123";
  const DESIGNATIONS   = ['CTO','GM','AGM','Senior Manager','Manager','Senior Executive','Executive','Junior Executive'];
  const STATUSES = [
    {label:'Pending',      cls:'s-pending'},
    {label:'In Progress',  cls:'s-inprogress'},
    {label:'Under Review', cls:'s-review'},
    {label:'Completed',    cls:'s-completed'},
    {label:'On Hold',      cls:'s-onhold'},
    {label:'Cancelled',    cls:'s-cancelled'},
  ];

  let isAdmin    = false;
  let allTasks   = {};
  let editingKey = null;

  const esc = s => (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const $   = id => document.getElementById(id);
  const fv  = id => ($(id)||{}).value || '';

  window.toggleAdmin = function() {
    if (isAdmin) { isAdmin = false; renderAll(); updateAdminUI(); return; }
    const pw = prompt('🔐 Admin Password লিখুন:');
    if (pw === ADMIN_PASSWORD) {
      isAdmin = true; renderAll(); updateAdminUI();
      alert('✅ Admin mode চালু হয়েছে!');
    } else if (pw !== null) {
      alert('❌ ভুল password!');
    }
  };

  function updateAdminUI() {
    const btn = $('adminBtn');
    if (!btn) return;
    btn.textContent = isAdmin ? '🔓 Admin (Logout)' : '🔐 Admin Login';
    btn.style.background = isAdmin ? '#1a5c33' : '#7b1416';
    $('addTaskBtn').style.display = isAdmin ? 'flex' : 'none';
  }

  onValue(TASKS_REF, snap => {
    allTasks = snap.val() || {};
    renderAll();
  });

  function renderAll() {
    const tbody = $('tableBody');
    if (!tbody) return;
    const keys = Object.keys(allTasks);
    $('totalCount').textContent = keys.length;

    if (keys.length === 0) {
      tbody.innerHTML = `<tr><td colspan="15" style="text-align:center;padding:48px;color:#6b7892;font-size:14px;">
        কোনো task নেই।${isAdmin ? '<br><br>উপরে <strong style="color:#e03030">+ Add Task</strong> বাটনে ক্লিক করুন।' : '<br><br>Admin task যোগ করলে এখানে দেখাবে।'}
      </td></tr>`;
      return;
    }

    tbody.innerHTML = '';
    keys.forEach((key, i) => {
      const r   = allTasks[key];
      const st  = STATUSES[r.status] || STATUSES[0];
      const pct = Math.min(100, Math.max(0, parseInt(r.progress)||0));
      const tr  = document.createElement('tr');
      tr.innerHTML = `
        <td>${i+1}</td>
        <td><strong style="color:#eee">${esc(r.jobTitle)}</strong></td>
        <td style="max-width:180px;white-space:normal;font-size:12px;color:#9ab">${esc(r.desc)||'—'}</td>
        <td>${esc(r.assignedBy)||'—'}</td>
        <td><span class="desig-tag">${esc(DESIGNATIONS[r.desig1]||'')}</span></td>
        <td>${esc(r.assignedTo)||'—'}</td>
        <td><span class="desig-tag">${esc(DESIGNATIONS[r.desig2]||'')}</span></td>
        <td style="font-size:12px;color:#aab">${esc(r.contact)||'—'}</td>
        <td style="white-space:nowrap;font-size:12px">${r.startDate||'—'}</td>
        <td style="white-space:nowrap;font-size:12px">${r.endDate||'—'}</td>
        <td>
          <div class="prog-wrap">
            <div class="prog-bar-bg"><div class="prog-bar-fill" style="width:${pct}%"></div></div>
            <span style="font-size:12px;color:#ccc;min-width:34px;text-align:right">${pct}%</span>
          </div>
        </td>
        <td><span class="status-badge ${st.cls}">${st.label}</span></td>
        <td style="font-size:12px;color:#aab">${esc(r.remark)||'—'}</td>
        <td style="font-size:11px;color:#6b7892;white-space:nowrap">${r.createdAt||''}</td>
        <td style="white-space:nowrap">
          ${isAdmin ? `
            <button class="action-btn edit-btn" onclick="openEdit('${key}')">✏️</button>
            <button class="action-btn del-btn"  onclick="deleteTask('${key}')">🗑️</button>
          ` : '<span style="color:#3a4560;font-size:12px">—</span>'}
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  window.openAdd = function() {
    editingKey = null;
    $('modalTitle').textContent = '➕ নতুন Task যোগ করুন';
    ['f_jobTitle','f_desc','f_assignedBy','f_assignedTo','f_contact','f_startDate','f_endDate','f_remark']
      .forEach(id => { if($(id)) $(id).value = ''; });
    $('f_desig1').value = 4; $('f_desig2').value = 6;
    $('f_progress').value = 0; $('f_status').value = 0;
    $('modal').style.display = 'flex';
  };

  window.openEdit = function(key) {
    editingKey = key;
    const r = allTasks[key];
    $('modalTitle').textContent = '✏️ Task Edit করুন';
    $('f_jobTitle').value   = r.jobTitle   || '';
    $('f_desc').value       = r.desc       || '';
    $('f_assignedBy').value = r.assignedBy || '';
    $('f_desig1').value     = r.desig1     ?? 4;
    $('f_assignedTo').value = r.assignedTo || '';
    $('f_desig2').value     = r.desig2     ?? 6;
    $('f_contact').value    = r.contact    || '';
    $('f_startDate').value  = r.startDate  || '';
    $('f_endDate').value    = r.endDate    || '';
    $('f_progress').value   = r.progress   ?? 0;
    $('f_status').value     = r.status     ?? 0;
    $('f_remark').value     = r.remark     || '';
    $('modal').style.display = 'flex';
  };

  window.closeModal = function() { $('modal').style.display = 'none'; editingKey = null; };

  window.saveTask = function() {
    const jobTitle = fv('f_jobTitle').trim();
    if (!jobTitle) { alert('⚠️ Job Title আবশ্যক!'); return; }
    const task = {
      jobTitle, desc: fv('f_desc'), assignedBy: fv('f_assignedBy'),
      desig1: parseInt(fv('f_desig1'))||4, assignedTo: fv('f_assignedTo'),
      desig2: parseInt(fv('f_desig2'))||6, contact: fv('f_contact'),
      startDate: fv('f_startDate'), endDate: fv('f_endDate'),
      progress: parseInt(fv('f_progress'))||0, status: parseInt(fv('f_status'))||0,
      remark: fv('f_remark'),
    };
    if (editingKey) {
      update(ref(db, 'tasks/' + editingKey), task);
    } else {
      task.createdAt = new Date().toLocaleString('en-GB');
      push(TASKS_REF, task);
    }
    closeModal();
  };

  window.deleteTask = function(key) {
    if (confirm('⚠️ এই task টা permanently delete করবেন?')) remove(ref(db, 'tasks/' + key));
  };

  window.filterTable = function(q) {
    document.querySelectorAll('#tableBody tr').forEach(tr => {
      tr.style.display = tr.innerText.toLowerCase().includes(q.toLowerCase()) ? '' : 'none';
    });
  };

  document.addEventListener('DOMContentLoaded', () => {
    $('lastUpdated').textContent = new Date().toLocaleString('en-GB');
    updateAdminUI();
  });
</script>

<style>
:root{--bg:#0f1318;--card:#181e27;--border:#252d3a;--accent:#e03030;--text:#e8eaf0;--muted:#6b7892;--radius:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);min-height:100vh;padding:24px 12px;color:var(--text)}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}
.wrapper{max-width:1700px;margin:0 auto;position:relative;z-index:1}
.header-card{background:linear-gradient(135deg,#7b1416,#c0321a,#b52626);border-radius:var(--radius) var(--radius) 0 0;padding:22px 28px 18px;color:#fff;position:relative;overflow:hidden}
.header-card::before{content:'';position:absolute;top:-60px;right:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.06)}
.header-title{font-family:'Rajdhani',sans-serif;font-size:26px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.header-meta{font-size:12px;opacity:.8;margin-top:8px;display:flex;gap:20px;flex-wrap:wrap;position:relative;z-index:1}
.toolbar{background:var(--card);padding:11px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.btn{border:none;padding:9px 18px;border-radius:8px;font-family:'Rajdhani',sans-serif;font-size:14px;font-weight:700;letter-spacing:.8px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .2s}
.btn-add{background:var(--accent);color:#fff;box-shadow:0 2px 12px rgba(224,48,48,.3);display:none}
.btn-add:hover{background:#c82020;transform:translateY(-1px)}
.btn-admin{color:#fff;font-size:13px}
.toolbar-sep{flex:1}
.search-box{border:1.5px solid var(--border);border-radius:8px;padding:8px 13px;font-family:'DM Sans',sans-serif;font-size:13px;width:210px;outline:none;background:#1a2030;color:var(--text);transition:border-color .2s}
.search-box:focus{border-color:var(--accent)}
.search-box::placeholder{color:var(--muted)}
.table-wrap{background:var(--card);border-radius:0 0 var(--radius) var(--radius);box-shadow:0 8px 32px rgba(0,0,0,.45);overflow:hidden}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:1300px}
thead tr{background:linear-gradient(90deg,#1f0a0a,#3a1010)}
thead th{color:#f5b8b8;font-family:'Rajdhani',sans-serif;font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:1px;padding:12px 13px;text-align:left;white-space:nowrap;border-right:1px solid rgba(255,100,80,.08)}
thead th:first-child{width:42px;text-align:center}
tbody tr{border-bottom:1px solid var(--border);transition:background .15s}
tbody tr:nth-child(even){background:#161b23}
tbody tr:hover{background:#1e252f}
td{padding:10px 13px;vertical-align:middle}
td:first-child{text-align:center;color:var(--muted);font-weight:600;font-size:12px}
.desig-tag{background:#1e1010;border:1.5px solid #3d1a1a;border-radius:6px;padding:3px 9px;font-size:11.5px;font-weight:600;color:#f0a0a0;white-space:nowrap}
.status-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.status-badge::before{content:'';width:5px;height:5px;border-radius:50%;flex-shrink:0}
.s-inprogress{background:#2e2000;color:#ffd05a;border:1.5px solid #6b4900}.s-inprogress::before{background:#f0a500}
.s-completed{background:#0a2015;color:#55e09a;border:1.5px solid #1a5c33}.s-completed::before{background:#28a745}
.s-pending{background:#2a0808;color:#ff8080;border:1.5px solid #6b1a1a}.s-pending::before{background:#dc3545}
.s-review{background:#061825;color:#6ab8f7;border:1.5px solid #0d4070}.s-review::before{background:#2196f3}
.s-onhold{background:#150d25;color:#b87cf5;border:1.5px solid #4a2080}.s-onhold::before{background:#9c27b0}
.s-cancelled{background:#1a1a1a;color:#888;border:1.5px solid #333}.s-cancelled::before{background:#555}
.prog-wrap{display:flex;align-items:center;gap:8px}
.prog-bar-bg{flex:1;height:5px;background:#1e2535;border-radius:10px;min-width:55px}
.prog-bar-fill{height:100%;border-radius:10px;background:linear-gradient(90deg,#e03030,#ff7a5a);transition:width .3s}
.action-btn{border:none;background:none;cursor:pointer;font-size:16px;padding:3px 5px;border-radius:5px;transition:background .15s}
.edit-btn:hover{background:#1a2a1a}.del-btn:hover{background:#2a1010}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:1000;align-items:center;justify-content:center;padding:16px}
.modal-box{background:#181e27;border:1.5px solid #3a1a1a;border-radius:14px;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.7)}
.modal-header{background:linear-gradient(135deg,#7b1416,#b52626);padding:18px 22px;border-radius:12px 12px 0 0;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:1}
.modal-header h3{font-family:'Rajdhani',sans-serif;font-size:18px;font-weight:700;color:#fff;letter-spacing:1px}
.modal-close{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;opacity:.8;line-height:1}
.modal-close:hover{opacity:1}
.modal-body{padding:22px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group.full{grid-column:1/-1}
label{font-size:11.5px;font-weight:600;color:#f5b8b8;text-transform:uppercase;letter-spacing:.8px;font-family:'Rajdhani',sans-serif}
.form-group input,.form-group select,.form-group textarea{background:#1a2030;border:1.5px solid var(--border);border-radius:7px;padding:9px 12px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--text);outline:none;transition:border-color .2s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent)}
.form-group select option{background:#1a2030}
.form-group input[type="date"]{color-scheme:dark}
.form-group textarea{resize:vertical;min-height:60px}
.modal-footer{padding:16px 22px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:#181e27}
.btn-save{background:var(--accent);color:#fff;padding:10px 24px;border:none;border-radius:8px;font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:700;cursor:pointer;letter-spacing:.8px;transition:all .2s}
.btn-save:hover{background:#c82020;transform:translateY(-1px)}
.btn-cancel{background:#252d3a;color:var(--muted);padding:10px 18px;border:none;border-radius:8px;font-family:'Rajdhani',sans-serif;font-size:14px;font-weight:600;cursor:pointer}
.btn-cancel:hover{background:#1e2535}
.footer{text-align:center;padding:14px;font-size:11.5px;color:var(--muted)}
.footer span{color:#e03030}
@media(max-width:600px){.form-grid{grid-template-columns:1fr}.form-group.full{grid-column:1}.header-title{font-size:20px}.search-box{width:150px}}
</style>
</head>
<body>
<div class="wrapper">
  <div class="header-card">
    <div class="header-title"><span>🔥</span> Fire &amp; Safety Work Tracker</div>
    <div class="header-meta">
      <span>🕐 <strong id="lastUpdated"></strong></span>
      <span>📋 মোট Task: <strong id="totalCount">0</strong></span>
    </div>
  </div>
  <div class="toolbar">
    <button class="btn btn-add" id="addTaskBtn" onclick="openAdd()">＋ Add Task</button>
    <button class="btn btn-admin" id="adminBtn" style="background:#7b1416" onclick="toggleAdmin()">🔐 Admin Login</button>
    <span class="toolbar-sep"></span>
    <input class="search-box" type="text" placeholder="🔍  Search…" oninput="filterTable(this.value)">
  </div>
  <div class="table-wrap">
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>SL</th><th>Job Title</th><th>Description</th>
            <th>Assigned By</th><th>Designation</th>
            <th>Assigned To</th><th>Designation</th>
            <th>Email / Phone</th><th>Start Date</th><th>End Date</th>
            <th>Progress</th><th>Status</th><th>Remark</th><th>Added At</th><th>Action</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="15" style="text-align:center;padding:40px;color:#6b7892">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
  <div class="footer">Normal user শুধু দেখতে পাবে &nbsp;•&nbsp; <span>Admin</span> login করলে Add / Edit / Delete করা যাবে</div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="modalTitle">➕ নতুন Task</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group full"><label>Job Title *</label><input id="f_jobTitle" type="text" placeholder="যেমন: Fire Extinguisher Check"></div>
        <div class="form-group full"><label>Description</label><textarea id="f_desc" placeholder="বিস্তারিত লিখুন…"></textarea></div>
        <div class="form-group"><label>Assigned By</label><input id="f_assignedBy" type="text" placeholder="নাম লিখুন"></div>
        <div class="form-group"><label>তার Designation</label>
          <select id="f_desig1"><option value="0">CTO</option><option value="1">GM</option><option value="2">AGM</option><option value="3">Senior Manager</option><option value="4" selected>Manager</option><option value="5">Senior Executive</option><option value="6">Executive</option><option value="7">Junior Executive</option></select>
        </div>
        <div class="form-group"><label>Assigned To</label><input id="f_assignedTo" type="text" placeholder="নাম লিখুন"></div>
        <div class="form-group"><label>তার Designation</label>
          <select id="f_desig2"><option value="0">CTO</option><option value="1">GM</option><option value="2">AGM</option><option value="3">Senior Manager</option><option value="4">Manager</option><option value="5">Senior Executive</option><option value="6" selected>Executive</option><option value="7">Junior Executive</option></select>
        </div>
        <div class="form-group full"><label>Email / Phone</label><input id="f_contact" type="text" placeholder="email বা phone number"></div>
        <div class="form-group"><label>Start Date</label><input id="f_startDate" type="date"></div>
        <div class="form-group"><label>End Date</label><input id="f_endDate" type="date"></div>
        <div class="form-group"><label>Progress % (0–100)</label><input id="f_progress" type="number" min="0" max="100" value="0"></div>
        <div class="form-group"><label>Status</label>
          <select id="f_status"><option value="0">Pending</option><option value="1">In Progress</option><option value="2">Under Review</option><option value="3">Completed</option><option value="4">On Hold</option><option value="5">Cancelled</option></select>
        </div>
        <div class="form-group full"><label>Remark</label><input id="f_remark" type="text" placeholder="যেকোনো মন্তব্য…"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">বাতিল</button>
      <button class="btn-save" onclick="saveTask()">💾 Save করুন</button>
    </div>
  </div>
</div>
</body>
</html>
